<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bowlr.club Tournament Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>/* Bowlr.club — bold sporty: navy rail and scoreboard, electric lime for the moments that matter. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #eaeef5; --ink: #0d1829; --muted: #56627a; --line: #dbe1eb; --line-strong: #c3cbd9;
  --accent: #142c52; --accent-hover: #0c1f3d; --accent-ink: #ffffff; --accent-soft: #e4eaf4; --jack: #b7791f; --jack-soft: #fbf0d9;
  --pop: #b8f035; --pop-ink: #0d1829; --pop-soft: #eefbd2;
  --rail: #0d1829; --rail-ink: #e8edf6; --rail-muted: #8d9bb4; --rail-hover: #1a2a44;
  --good: #1f7a45; --good-soft: #e1f3e8; --warn: #9a5d08; --warn-soft: #fbefd9; --bad: #c0281e; --bad-soft: #fde6e3; --info: #2457a8; --info-soft: #e4ecfa;
  --focus: #2f80ff; --shadow: 0 1px 2px rgba(13,24,41,.06), 0 4px 16px rgba(13,24,41,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px; --r-s: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a111e; --surface: #111b2c; --surface-2: #19253a; --ink: #e8edf6; --muted: #93a1ba; --line: #22304a; --line-strong: #32425f;
  --accent: #b8f035; --accent-hover: #cdf76a; --accent-ink: #0d1829; --accent-soft: #1f2e1a; --jack: #e8b35a; --jack-soft: #3a2e17;
  --pop: #b8f035; --pop-ink: #0d1829; --pop-soft: #233318;
  --rail: #070d18; --rail-ink: #e8edf6; --rail-muted: #8391a9; --rail-hover: #142035;
  --good: #6fd39a; --good-soft: #15301f; --warn: #eaa955; --warn-soft: #3a2b14; --bad: #ff8f84; --bad-soft: #3d1b19; --info: #8fb6ff; --info-soft: #182a47;
  --focus: #7fb2ff; --shadow: 0 1px 2px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a111e; --surface: #111b2c; --surface-2: #19253a; --ink: #e8edf6; --muted: #93a1ba; --line: #22304a; --line-strong: #32425f;
  --accent: #b8f035; --accent-hover: #cdf76a; --accent-ink: #0d1829; --accent-soft: #1f2e1a; --jack: #e8b35a; --jack-soft: #3a2e17;
  --pop: #b8f035; --pop-ink: #0d1829; --pop-soft: #233318;
  --rail: #070d18; --rail-ink: #e8edf6; --rail-muted: #8391a9; --rail-hover: #142035;
  --good: #6fd39a; --good-soft: #15301f; --warn: #eaa955; --warn-soft: #3a2b14; --bad: #ff8f84; --bad-soft: #3d1b19; --info: #8fb6ff; --info-soft: #182a47;
  --focus: #7fb2ff; --shadow: 0 1px 2px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; letter-spacing: .005em; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; font-style: italic; }
h2, .h2 { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; margin: 0; }
h3 { font-size: 1.15rem; }
h4 { font-size: 1rem; margin: 4px 0 6px; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; z-index: 50; border-radius: var(--r-s); }
.skip:focus { left: 8px; }
.muted { color: var(--muted); } .small { font-size: .875rem; } .strong { font-weight: 600; } .nowrap { white-space: nowrap; }
.num, .score, td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .09em; font-size: .78rem; font-weight: 600; color: var(--accent); margin: 0 0 4px; }
.row { display: flex; align-items: center; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; } .end { align-items: flex-end; justify-content: flex-end; }
.gap-s { gap: 8px; } .gap-m { gap: 16px; } .grow { flex: 1 1 auto; min-width: 0; }
.stack-s { display: grid; gap: 8px; } .stack-m { display: grid; gap: 16px; } .stack-l { display: grid; gap: 24px; }
.mt { margin-top: 12px; }
.grid-2 { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid-3 { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: start; }
.grid-4 { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: start; }
.grid-main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 960px) { .grid-main { grid-template-columns: minmax(0, 1fr); } }

/* Shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 18px 12px 14px max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--rail); background: var(--rail); color: var(--rail-ink); overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 12px; }
.brand-bowl { fill: var(--pop); } .brand-ring { fill: none; stroke: var(--pop-ink); stroke-width: 2; } .brand-jack { fill: var(--rail-ink); }
.brand-n { font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; line-height: 1; letter-spacing: -.01em; font-style: italic; }
.brand-n span { color: var(--pop); }
.brand-s { font-size: .74rem; color: var(--rail-muted); text-transform: uppercase; letter-spacing: .08em; }
.side nav { display: grid; gap: 2px; }
.nav-i { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: var(--r-s); color: var(--rail-muted); cursor: pointer; text-align: left; font-weight: 500; }
.nav-i:hover { background: var(--rail-hover); color: var(--rail-ink); }
.nav-i.on { background: var(--rail-hover); color: var(--pop); font-weight: 700; box-shadow: inset 3px 0 var(--pop); }
.side-foot { margin-top: auto; padding: 8px; color: var(--rail-muted); }
.side .saved { color: var(--pop); }
.saved { color: var(--good); } .unsaved { color: var(--warn); }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); min-width: 0; }
.crumbs strong { color: var(--ink); } .crumb-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.t-switch { display: flex; align-items: center; gap: 8px; }
.t-switch select { max-width: 260px; }
.nav-toggle { display: none; }
.content { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; width: 100%; outline: none; }
@media (min-width: 900px) { .content { padding-left: 32px; padding-right: 32px; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 40; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); padding-top: max(18px, env(safe-area-inset-top, 0px)); }
  .nav-open .side { transform: none; }
  .nav-toggle { display: inline-flex; }
  .crumbs > span, .crumbs > .ic, .crumb-t { display: none; }
  .t-switch select { max-width: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h > div:first-child { display: grid; gap: 6px; min-width: 0; max-width: 72ch; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-s); border: 1px solid transparent; cursor: pointer; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.btn-md { padding: 8px 14px; font-size: .95rem; } .btn-sm { padding: 5px 10px; font-size: .85rem; } .btn-lg { padding: 12px 22px; font-size: 1.1rem; font-family: var(--f-display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-lg.btn-primary { background: var(--pop); color: var(--pop-ink); box-shadow: 0 2px 0 rgba(13,24,41,.25); } .btn-lg.btn-primary:hover:not(:disabled) { background: var(--accent-hover); color: var(--accent-ink); } .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); } .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--ink); } .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.file-btn { position: relative; }
input:not([type=checkbox]):not([type=range]):not([type=radio]), select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--surface); min-height: 40px; }
textarea { resize: vertical; }
input[aria-invalid=true] { border-color: var(--bad); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-weight: 600; font-size: .9rem; }
.hint { font-size: .82rem; color: var(--muted); } .err { color: var(--bad); font-size: .88rem; font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; font-size: .95rem; }
.seed-in { width: 90px !important; min-height: 32px !important; padding: 4px 8px !important; font-family: var(--f-mono); }
.score-in { width: 64px !important; text-align: center; font-family: var(--f-mono); font-size: 1.05rem; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; vertical-align: middle; }
.badge-neutral { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.badge-good { background: var(--good-soft); color: var(--good); } .badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); } .badge-info { background: var(--info-soft); color: var(--info); }
.badge-accent { background: var(--accent); color: var(--accent-ink); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; flex: none; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .9rem; text-transform: capitalize; }
.chip:hover { background: var(--surface-2); } .chip-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-list { display: flex; flex-wrap: wrap; gap: 8px; } .chip-list .chip { text-transform: none; text-align: left; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }
.link:hover { text-decoration: underline; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.card-ht { display: grid; gap: 2px; min-width: 0; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-s); border-left: 4px solid; align-items: flex-start; }
.callout > .ic { flex: none; margin-top: 2px; } .callout > div { display: grid; gap: 6px; min-width: 0; }
.callout-info { background: var(--info-soft); border-color: var(--info); } .callout-good { background: var(--good-soft); border-color: var(--good); }
.callout-warn { background: var(--warn-soft); border-color: var(--warn); } .callout-bad { background: var(--bad-soft); border-color: var(--bad); }
.callout-info .ic { color: var(--info); } .callout-good .ic { color: var(--good); } .callout-warn .ic { color: var(--warn); } .callout-bad .ic { color: var(--bad); }
.empty { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 36px 20px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.empty p { max-width: 56ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.stat-l { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.stat-v { font-family: var(--f-display); font-size: 2.1rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-s { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.stat-warn .stat-v { color: var(--warn); } .stat-bad .stat-v { color: var(--bad); } .stat-good .stat-v { color: var(--good); }
.subpanel { background: var(--surface-2); border-radius: var(--r-s); padding: 12px; display: grid; gap: 10px; }

/* Tables */
.table-wrap { overflow-x: auto; min-width: 0; }
.table-wrap.tall { max-height: 460px; overflow-y: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .93rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.tbl.kv th { text-transform: none; letter-spacing: 0; font-size: .9rem; color: var(--ink); width: 34%; border-bottom: 1px solid var(--line); }
.standings td.num, .standings th { text-align: center; } .standings td:nth-child(2), .standings th:nth-child(2) { text-align: left; }
.row-good td:first-child { box-shadow: inset 3px 0 var(--good); }
.row-bad td { background: var(--bad-soft); } .row-bad td:first-child { box-shadow: inset 3px 0 var(--bad); }
.row-bye td { color: var(--muted); }
.rink-tag { display: inline-flex; min-width: 2.2em; justify-content: center; padding: 1px 6px; border-radius: 4px; background: var(--ink); color: var(--bg); font-family: var(--f-mono); font-size: .82rem; font-weight: 600; }
.prog { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 80px; }
.prog > div { height: 100%; background: var(--good); }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); } .tab.on { color: var(--ink); border-color: var(--accent); }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(15, 20, 17, .45); display: grid; place-items: center; z-index: 60; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: var(--r); width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); border: 1px solid var(--line); }
.modal-wide { width: min(820px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 8px; }
.modal-h h2 { font-size: 1.25rem; }
.modal-b { padding: 18px; overflow-y: auto; display: grid; gap: 14px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 80; max-width: min(420px, calc(100% - 32px)); }
.toast { padding: 11px 14px; border-radius: var(--r-s); background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-weight: 500; border-left: 4px solid var(--good); }
.toast-bad { border-left-color: var(--bad); } .toast-info { border-left-color: var(--info); }

/* Score board (result entry) — styled like a rink scoreboard */
.score-board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; background: var(--rail); color: var(--rail-ink); border-bottom: 4px solid var(--pop); border-radius: var(--r); padding: 16px; }
.sb-side { display: grid; gap: 8px; text-align: center; min-width: 0; }
.sb-name { font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
.sb-input { font-family: var(--f-mono) !important; font-size: 2.4rem !important; text-align: center; background: var(--surface) !important; color: var(--ink) !important; height: 64px; font-weight: 600; }
.sb-input:disabled { opacity: .35; }
.sb-vs { font-family: var(--f-display); font-size: 1.1rem; color: var(--pop); padding-bottom: 20px; }
.ends-detail summary { cursor: pointer; font-weight: 600; }
.ends-grid { display: grid; gap: 6px; margin: 10px 0; }
.end-row { display: grid; grid-template-columns: 70px 80px 80px; gap: 8px; align-items: center; }

/* Dashboard */
.todo, .activity, .desk-list, .issues, .changes, .bullets, .trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.todo li, .desk-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.todo li:last-child, .desk-row:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot-bad { background: var(--bad); } .dot-warn { background: var(--warn); } .dot-info { background: var(--info); }
.activity li { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 640px) { .activity li { grid-template-columns: 1fr; gap: 2px; } }
.journey { margin: 0; padding-left: 22px; columns: 2; column-gap: 24px; font-size: .95rem; }
.journey li { padding: 2px 0; }
.scen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.scen { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 16px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); }
.scen-id { width: 44px; height: 44px; border-radius: 50%; background: var(--pop); color: var(--pop-ink); font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; display: grid; place-items: center; box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--accent-ink) 25%, transparent); }
.t-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .t-cards { grid-template-columns: minmax(0, 1fr); } }
